<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor Meteorológico de Temperaturas</title>
<style>
:root{--bg1:#4f7f6a;--bg2:#8bc6a2;--text:#fff;--card:rgba(255,255,255,.15);--radius:24px}
body.cold{--bg1:#0f4c81;--bg2:#4fc3f7}
body.mild{--bg1:#4f7f6a;--bg2:#8bc6a2}
body.hot{--bg1:#d94841;--bg2:#ffb347}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff;background:linear-gradient(135deg,var(--bg1),var(--bg2));transition:.7s}
.app{width:min(900px,100%)}
.card{background:var(--card);backdrop-filter:blur(18px);padding:30px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,.2)}
h1{text-align:center;margin-bottom:10px}.desc{text-align:center;margin-bottom:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
label{display:block;margin-bottom:8px;font-weight:700}
input,select{width:100%;padding:14px;border:none;border-radius:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{padding:14px 18px;border:none;border-radius:14px;cursor:pointer;font-weight:700}
.result{margin-top:24px;text-align:center;padding:24px;background:rgba(255,255,255,.12);border-radius:20px}
.value{font-size:2.2rem;font-weight:800;margin-top:8px}.msg{margin-top:14px;min-height:24px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.actions button{width:100%}}
</style>
</head>
<body class="mild">
<div class="app"><div class="card">
<h1>🌡️ Conversor Meteorológico</h1>
<p class="desc">Convierte temperaturas entre Celsius, Fahrenheit y Kelvin.</p>
<form id="converterForm">
<div class="grid">
<div class="full"><label>Temperatura</label><input id="temperature" type="number" step="any" placeholder="Ej: 25.5"></div>
<div><label>Origen</label><select id="fromUnit"><option value="C">Celsius (°C)</option><option value="F">Fahrenheit (°F)</option><option value="K">Kelvin (K)</option></select></div>
<div><label>Destino</label><select id="toUnit"><option value="F">Fahrenheit (°F)</option><option value="C">Celsius (°C)</option><option value="K">Kelvin (K)</option></select></div>
</div>
<div class="actions">
<button type="button" id="swapBtn">⇄ Intercambiar</button>
<button type="submit">Convertir</button>
<button type="button" id="clearBtn">Limpiar</button>
</div></form>
<div id="message" class="msg"></div>
<div class="result"><div>Resultado</div><div id="resultValue" class="value">--</div><div id="indicator">🌤️ Esperando conversión</div></div>
</div></div>
<script>
const form=document.getElementById('converterForm');const temp=document.getElementById('temperature');const from=document.getElementById('fromUnit');const to=document.getElementById('toUnit');
function toC(v,u){if(u==='C')return v;if(u==='F')return(v-32)*5/9;return v-273.15}
function fromC(v,u){if(u==='C')return v;if(u==='F')return(v*9/5)+32;return v+273.15}
function below(v,u){if(u==='C')return v<-273.15;if(u==='F')return v<-459.67;return v<0}
function fmt(v){return Number(v.toFixed(2))}
function theme(c){document.body.className=c<5?'cold':c>25?'hot':'mild';document.getElementById('indicator').innerHTML=c<5?'❄️ Ambiente frío':c>25?'☀️ Ambiente cálido':'🌤️ Temperatura moderada'}
function convert(){const m=document.getElementById('message');if(temp.value.trim()===''){m.textContent='⚠ Debe ingresar una temperatura';return}const v=Number(temp.value);if(Number.isNaN(v)){m.textContent='⚠ Valor inválido';return}if(below(v,from.value)){m.textContent='⚠ Inferior al cero absoluto';return}const c=toC(v,from.value);const r=fromC(c,to.value);document.getElementById('resultValue').textContent=fmt(r)+' '+(to.value==='K'?'K':'°'+to.value);theme(c);m.textContent='✓ Conversión realizada correctamente'}
form.addEventListener('submit',e=>{e.preventDefault();convert()});
document.getElementById('swapBtn').onclick=()=>{let x=from.value;from.value=to.value;to.value=x;if(temp.value)convert()};
document.getElementById('clearBtn').onclick=()=>{temp.value='';document.getElementById('resultValue').textContent='--';document.getElementById('message').textContent='';document.getElementById('indicator').innerHTML='🌤️ Esperando conversión';document.body.className='mild'};
temp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();convert()}})
</script>
</body></html>
